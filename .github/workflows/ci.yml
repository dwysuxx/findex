name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # з v8 рухомих тегів vN немає — лише повна версія
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pyright

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # з v8 рухомих тегів vN немає — лише повна версія
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest --cov=findex --cov-report=term
      - name: CLI smoke test from the built wheel
        shell: bash
        run: |
          uv build
          uvx --from dist/findex-*.whl findex --version
          uvx --from dist/findex-*.whl findex index data/dota2wiki.jsonl --out idx.bin --positions --limit 20
          uvx --from dist/findex-*.whl findex search idx.bin hero --json -k 3

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t findex .
      - name: Run container and probe it
        run: |
          docker run -d --name findex -p 8000:8000 findex
          for i in $(seq 30); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs localhost:8000/health | grep -q '"status":"ok"'
          curl -fs 'localhost:8000/search?q=pudge&k=3' | grep -q '"title":"pudge"'
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8000/search?k=abc')" = 422
          test "$(docker exec findex id -u)" = 10001   # не root
          docker logs findex | head -5
      - name: Graceful shutdown (SIGTERM -> lifespan teardown)
        run: |
          docker stop -t 20 findex
          docker logs findex 2>&1 | grep -q '"msg": "index closed"'
          test "$(docker inspect -f '{{.State.ExitCode}}' findex)" = 0
