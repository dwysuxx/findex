name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # з v8 рухомих тегів vN немає — лише повна версія
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pyright

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # з v8 рухомих тегів vN немає — лише повна версія
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest --cov=findex --cov-report=term
      - name: CLI smoke test from the built wheel
        shell: bash
        run: |
          uv build
          uvx --from dist/findex-*.whl findex --version
          uvx --from dist/findex-*.whl findex index data/dota2wiki.jsonl --out idx.bin --positions --limit 20
          uvx --from dist/findex-*.whl findex search idx.bin hero --json -k 3
