name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # з v8 рухомих тегів vN немає — лише повна версія
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests benchmarks
      - run: uv run ruff format --check src tests benchmarks
      - run: uv run pyright

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # з v8 рухомих тегів vN немає — лише повна версія
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest --cov=findex --cov-report=term
      - name: CLI smoke test from the built wheel
        shell: bash
        run: |
          uv build
          uvx --from dist/findex-*.whl findex --version
          uvx --from dist/findex-*.whl findex index data/dota2wiki.jsonl --out idx.bin --positions --limit 20
          uvx --from dist/findex-*.whl findex search idx.bin hero --json -k 3

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t findex .
      - name: Run container and probe it
        run: |
          docker run -d --name findex -p 8000:8000 findex
          for i in $(seq 60); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs localhost:8000/health > /dev/null || { docker logs findex; exit 1; }  # не стартував — чому
          curl -fs localhost:8000/health | grep -q '"status":"ok"'
          curl -fs 'localhost:8000/search?q=pudge&k=3' | grep -q '"title":"pudge"'
          # Lab 08: модель запечена в образ, HF_HUB_OFFLINE=1 — семантика працює без мережі
          curl -fs 'localhost:8000/search?q=butcher+who+drags+victims+with+a+chain&mode=semantic&k=3' | grep -q '"title":"pudge"'
          curl -fs 'localhost:8000/stats' | grep -q '"model":"BAAI/bge-small-en-v1.5"'
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8000/search?k=abc')" = 422
          test "$(docker exec findex id -u)" = 10001   # не root
          docker logs findex | head -5
      - name: Graceful shutdown (SIGTERM -> lifespan teardown)
        run: |
          docker stop -t 20 findex
          docker logs findex 2>&1 | grep -q '"msg": "index closed"'
          test "$(docker inspect -f '{{.State.ExitCode}}' findex)" = 0

  bench:
    # Lab 08: pytest-benchmark проти baseline, знятого на такому самому раннері; регресія 2× — червоний CI
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked
      - name: Benchmarks vs baseline
        run: |
          common="benchmarks --benchmark-only --benchmark-storage=benchmarks/baseline --benchmark-json=bench.json"
          if compgen -G "benchmarks/baseline/*/0001_*.json" > /dev/null; then
            uv run pytest $common --benchmark-compare=0001 --benchmark-compare-fail=median:100%
          else
            echo "::warning::baseline ще немає — зберігаю цей прогін як 0001 (артефакт bench)"
            uv run pytest $common --benchmark-save=baseline
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench
          path: |
            bench.json
            benchmarks/baseline

  profile:
    # Lab 08, M1: Scalene (Python / native / system по рядках) — на Windows він не збирає семплів.
    # Профілюємо і код тегу lab-07 («до»), і поточний («після») тим самим навантаженням.
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      COLUMNS: "160"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # потрібен тег lab-07
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run findex index data/dota2wiki.jsonl -o index.bin --positions
      - name: Scalene, after (current code)
        run: |
          uv run scalene run --cpu-only --profile-only findex -o scalene_after.json \
            src/findex/perf/workload.py --- search index.bin "hero damage attack" -n 100
          uv run scalene view --cli scalene_after.json > scalene_after.txt
      - name: Scalene, before (lab-07)
        run: |
          git worktree add --detach /tmp/lab07 lab-07
          PYTHONPATH=/tmp/lab07/src uv run scalene run --cpu-only --profile-only findex -o scalene_before.json \
            src/findex/perf/workload.py --- search index.bin "hero damage attack" -n 100
          uv run scalene view --cli scalene_before.json > scalene_before.txt
      - run: head -c 6000 scalene_before.txt; head -c 6000 scalene_after.txt
      - uses: actions/upload-artifact@v7
        with:
          name: scalene
          path: scalene_*
